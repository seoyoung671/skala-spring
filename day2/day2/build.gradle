plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    springAiVersion = '1.1.8'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-tika-document-reader'
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform {
        if (!project.hasProperty('eval')) {
            excludeTags 'eval'
        }
    }
}

def ragExperiments = [
    evalA: [label: 'A 기준', chunk: 400, topK: 4, threshold: 0.5, overlap: 0],
    evalB: [label: 'B 작게', chunk: 200, topK: 4, threshold: 0.5, overlap: 0],
    evalC: [label: 'C 크게', chunk: 800, topK: 4, threshold: 0.5, overlap: 0],
    evalD: [label: 'D 넓게', chunk: 400, topK: 8, threshold: 0.5, overlap: 0],
    evalE: [label: 'E 엄격', chunk: 400, topK: 4, threshold: 0.7, overlap: 0],
    evalF: [label: 'F 겹침', chunk: 400, topK: 4, threshold: 0.5, overlap: 20]
]

def previousExperimentTask = null
ragExperiments.each { taskName, config ->
    def predecessor = previousExperimentTask
    def experimentTask = tasks.register(taskName, Test) {
        group = 'verification'
        description = "RAG 실험 ${config.label} 조합으로 골든 세트를 평가한다."
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags 'eval' }

        systemProperty 'lab2.eval.name', config.label
        systemProperty 'lab2.eval.top-k', config.topK
        systemProperty 'lab2.eval.enforce-baseline', false
        systemProperty 'lab2.rag.chunk-size', config.chunk
        systemProperty 'lab2.rag.similarity-threshold', config.threshold
        systemProperty 'lab2.rag.overlap-percent', config.overlap
        systemProperty 'lab2.eval.result-file',
                layout.buildDirectory.file("eval-results/${taskName}.txt").get().asFile.absolutePath

        outputs.upToDateWhen { false }
        testLogging {
            events 'passed', 'failed'
            showStandardStreams = true
        }
    }
    if (predecessor != null) {
        experimentTask.configure { mustRunAfter predecessor }
    }
    previousExperimentTask = experimentTask
}

tasks.register('evalAll') {
    group = 'verification'
    description = 'RAG A~F 실험을 순차적으로 모두 실행한다.'
    dependsOn ragExperiments.keySet()
    doLast {
        println ''
        println '| 조합 | 청크 | top-k | threshold | 겹침 | 통과율 |'
        println '|---|---:|---:|---:|---:|---:|'
        ragExperiments.each { taskName, config ->
            def result = layout.buildDirectory.file("eval-results/${taskName}.txt").get().asFile
            def score = result.exists() ? result.text.trim().replace(',', '/') : '결과 없음'
            println "| ${config.label} | ${config.chunk} | ${config.topK} | ${config.threshold} | ${config.overlap}% | ${score} |"
        }
    }
}

tasks.named('bootRun') {
    jvmArgs = ['-Dfile.encoding=UTF-8']
}
