spring.application.name=day3
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small

lab3.policy.ingest-enabled=true
lab3.rag.top-k=4
lab3.rag.similarity-threshold=0.3
lab3.tools.max-calls-per-request=3

spring.datasource.url=jdbc:h2:mem:day3;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

logging.level.AI_TOOL_AUDIT=INFO
logging.level.REFUND_AUDIT=INFO
logging.level.AI_CHAT_AUDIT=INFO
logging.level.AI_SAFETY=INFO
logging.level.AI_RAG=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId:-none}] %logger{36} : %msg%n

management.endpoints.web.exposure.include=health,info,metrics
management.metrics.tags.application=day3
