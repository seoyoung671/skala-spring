spring.application.name=helpdesk

# API 키는 소스에 저장하지 않고 실행 환경의 OPENAI_API_KEY에서 주입한다.
# not-set은 로컬 컨텍스트 테스트용 값이며 실제 AI 호출에는 유효한 키가 필요하다.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}

# 상담 답변은 일관성이 중요하므로 비교적 낮은 temperature를 사용한다.
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# 정책 문서와 사용자 질문을 같은 벡터 공간으로 변환할 임베딩 모델이다.
spring.ai.openai.embedding.options.model=text-embedding-3-small

# 운영 VectorStore는 PostgreSQL의 vector 확장을 사용한다.
# text-embedding-3-small의 기본 출력 크기와 같은 1536차원으로 테이블을 생성한다.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536

# 접속 정보는 환경변수로 교체할 수 있으며 로컬 기본값은 compose.yaml과 일치한다.
spring.datasource.url=${HELPDESK_DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${HELPDESK_DB_USERNAME:helpdesk}
spring.datasource.password=${HELPDESK_DB_PASSWORD:helpdesk}
spring.jpa.hibernate.ddl-auto=update

# RAG가 한 질문에 가져올 최대 청크 수와 최소 유사도다.
helpdesk.rag.top-k=5
helpdesk.rag.threshold=0.62

# conversationId별로 보존할 최근 메시지의 최대 개수다.
helpdesk.memory.max=20

# 문서 분할과 검색 품질 확인 화면에서 사용할 미리보기 크기다.
helpdesk.ingest.chunk-size=800
helpdesk.ingest.min-chunk-size-chars=350
helpdesk.ingest.preview-length=160
