# 테스트는 외부 PostgreSQL 없이 임베디드 H2로 JPA 컨텍스트만 검증한다.
spring.datasource.url=jdbc:h2:mem:helpdesk-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# JDBC ChatMemoryRepository가 사용할 테스트용 메모리 테이블을 H2에 생성한다.
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# VectorStore는 테스트 클래스에서 MockBean으로 대체하므로 스키마를 만들지 않는다.
spring.ai.vectorstore.pgvector.initialize-schema=false
